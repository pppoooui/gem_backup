services:
  dfcgem-web:
    # Built by .github/workflows/docker-image.yml. No build section on purpose:
    # building on the 447MB server freezes it, so compose can only pull.
    image: ${DFCGEM_IMAGE:-ghcr.io/pppoooui/gem_backup:latest}
    container_name: dfcgem-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
